# M2smart production front door: HTTPS for the web app, which is the only service it reaches. The
# API, Kratos and the database are never exposed; the web app proxies /api/v1/* to the API itself.
# The certificate is the one bought for the domain (infra/prod/certs/web/, see README.md).

worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  client_max_body_size 2m;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Sign-in, sign-up and code requests (server actions POSTed to these pages) per address: each one
  # can send an SMS. The API also limits codes per phone number.
  map "$request_method:$uri" $auth_limit_key {
    ~^POST:/(login|register|forgot-password) $binary_remote_addr;
    default "";
  }
  limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=all:20m rate=30r/s;
  limit_req_status 429;

  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # The camera is for scanning a board's QR code.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Everything comes from this origin. Next.js puts inline scripts and styles in its pages.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
      limit_req zone=all burst=100 nodelay;
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://web;
    }

    # Live updates: a long-lived stream (the API ends it every 10 minutes); never buffered.
    location ~ ^/api/v1/properties/[^/]+/events$ {
      proxy_pass http://web;
      proxy_buffering off;
      proxy_read_timeout 15m;
    }
  }
}
