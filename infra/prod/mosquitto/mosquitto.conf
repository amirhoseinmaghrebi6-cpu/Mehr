# M2smart production broker.
# - 1883: plaintext, inside the compose network only (the API). Never published.
# - 8883: TLS, the port the ESP32 boards connect to. The server certificate is signed by our own
#   certificate authority (infra/prod/certs.sh); the boards carry its ca.crt in their firmware.
# Every client logs in. The accounts live in PostgreSQL (schema broker): the broker checks them
# through mosquitto-go-auth and the database login m2_broker, as in development
# (supabase/migrations/202611070001_broker_accounts.sql). __BROKER_DB_PASSWORD__ and __DATABASE__
# are filled in when the container starts (compose.yaml).

per_listener_settings false
allow_anonymous false

listener 1883

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

auth_plugin /mosquitto/go-auth.so
auth_opt_log_level warn
auth_opt_backends postgres
auth_opt_hasher pbkdf2
auth_opt_hasher_algorithm sha256
auth_opt_hasher_keylen 32
auth_opt_pg_host postgres
auth_opt_pg_port 5432
auth_opt_pg_dbname __DATABASE__
auth_opt_pg_user m2_broker
auth_opt_pg_password __BROKER_DB_PASSWORD__
auth_opt_pg_sslmode disable
auth_opt_pg_userquery select broker.account_password($1)
auth_opt_pg_superquery select broker.is_service_account($1)
auth_opt_pg_aclquery select broker.board_topics($1, $2)
# Cached, so a message is not a database query: Mosquitto calls the plugin on its one thread, and
# the database round trip would cap the broker. A replaced or removed secret stops working within
# 5 s (its live connection is cut at once: broker.ts), a removed board's topic rights within 30 s.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 5
auth_opt_acl_cache_seconds 30

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
