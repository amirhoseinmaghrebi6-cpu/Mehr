# M2smart local development broker (Phase 2A).
# Dev only: anonymous, plaintext, no ACLs. The host port is bound to 127.0.0.1 in compose.yaml.
# Broker authentication, ACLs, TLS and topic design come in later phases.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
