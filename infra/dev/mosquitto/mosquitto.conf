# M2smart local development broker.
# Every client logs in: the API with the account from infra/dev/.env, each ESP32 board with the
# account the API creates for it at pairing. Accounts and their topic rules are managed by the
# API through Mosquitto's dynamic security plugin (docs/board-protocol.md).
# Dev only: plaintext on a host port bound to 127.0.0.1 in compose.yaml; production adds TLS.

listener 1883
allow_anonymous false
per_listener_settings false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
